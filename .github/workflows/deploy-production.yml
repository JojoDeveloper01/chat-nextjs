name: Deploy production to Bunker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: chat-nextjs-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - chat-nextjs-prod
      - bunker
      - arm64
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repository to production path
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env' \
            --exclude 'backups' \
            ./ /opt/empire/apps/chat-nextjs/app/

      - name: Deploy with Docker Compose
        working-directory: /opt/empire/apps/chat-nextjs/app
        env:
          DOCKER_CMD: sudo docker
        run: |
          set -euo pipefail
          ./scripts/deploy-local.sh

      - name: Verify local health
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS --max-time 10 http://127.0.0.1:3100/ >/dev/null; then
              status=$(curl -sS -o /tmp/chat-nextjs-users-check.txt -w '%{http_code}' --max-time 10 http://127.0.0.1:3100/api/users || true)
              if [ "$status" = "401" ]; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "chat-nextjs local health check failed" >&2
          sudo docker compose -f /opt/empire/apps/chat-nextjs/app/docker-compose.yml ps >&2 || true
          sudo docker logs --tail=120 app-app-1 >&2 || true
          exit 1

      - name: Verify public health
        run: |
          set -euo pipefail
          for i in {1..15}; do
            if curl -fsS --max-time 15 https://chatnextjs.josethbalcazar.com/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "chat-nextjs public health check failed" >&2
          exit 1
